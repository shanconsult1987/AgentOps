name: Security

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:

  codeql:

    name: CodeQL

    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v3